{% extends 'base.html' %}

{% block title %}Log In - Lundayang Marians{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1 style="font-family: Georgia, serif; font-size: 2rem; font-weight: bold; margin-bottom: 1.25rem;">{{ t('Log In') }}
            </h1>
        </div>

        {% if msg %}
        <div class="alert alert-success" style="margin-bottom: 1rem;">
            <span>{{ msg }}</span>
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-danger" style="margin-bottom: 1rem;">
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <!-- Student ID or Email Field -->
            <div class="form-group">
                <input type="text" id="student_id" name="student_id" class="form-control" placeholder="{{ t('Student ID or Email') }}"
                    required>
            </div>

            <!-- Password Field -->
            <div class="form-group" style="position: relative;">
                <input type="password" id="password" name="password" class="form-control form-control-password" placeholder="{{ t('Password') }}"
                    required>
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" title="Toggle password visibility">
                    <i data-lucide="eye" style="width: 20px; height: 20px;"></i>
                </button>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-auth-submit">{{ t('Log In') }}</button>
        </form>

        <!-- Registration & Forgot Password links -->
        <div class="auth-footer" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1.25rem;">
            <div>
                <a href="{{ url_for('forgot_password') }}">{{ t('Forgot Password?') }}</a>
            </div>
            <div>
                <a href="{{ url_for('signup') }}">{{ t('Create an Account') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
