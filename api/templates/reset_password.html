{% extends 'base.html' %}

{% block title %}Reset Password - Lundayang Marians{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1 style="font-family: Georgia, serif; font-size: 2rem; font-weight: bold; margin-bottom: 1.25rem;">{{ t('Reset Password') }}</h1>
            <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 1.5rem;">
                {{ t('Enter your new password below.') }}
            </p>
        </div>

        {% if msg %}
        <div class="alert alert-success" style="margin-bottom: 1rem;">
            <span>{{ msg }}</span>
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-danger" style="margin-bottom: 1rem;">
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('reset_password') }}" method="POST" id="reset-password-form">
            <!-- Hidden inputs for auth tokens passed from URL fragments/params -->
            <input type="hidden" name="access_token" id="access_token">
            <input type="hidden" name="code" id="code">
            <input type="hidden" name="token_hash" id="token_hash">

            <!-- New Password Field -->
            <div class="form-group" style="position: relative;">
                <input type="password" id="password" name="password" class="form-control form-control-password" placeholder="{{ t('New Password') }}" required>
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" title="Toggle password visibility">
                    <i data-lucide="eye" style="width: 20px; height: 20px;"></i>
                </button>
            </div>

            <!-- Confirm New Password Field -->
            <div class="form-group" style="position: relative;">
                <input type="password" id="confirm_password" name="confirm_password" class="form-control form-control-password" placeholder="{{ t('Confirm New Password') }}" required>
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirm_password', this)" title="Toggle password visibility">
                    <i data-lucide="eye" style="width: 20px; height: 20px;"></i>
                </button>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-auth-submit">{{ t('Set New Password') }}</button>
        </form>

        <div class="auth-footer" style="margin-top: 1.25rem;">
            <a href="{{ url_for('login') }}">{{ t('Back to Log In') }}</a>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Extract access_token from URL hash fragment (#access_token=...)
    if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        if (accessToken) {
            document.getElementById('access_token').value = accessToken;
        }
    }
    
    // Extract code or token_hash from query params (?code=... or ?token_hash=...)
    if (window.location.search) {
        const queryParams = new URLSearchParams(window.location.search);
        const code = queryParams.get('code');
        const tokenHash = queryParams.get('token_hash');
        if (code) {
            document.getElementById('code').value = code;
        }
        if (tokenHash) {
            document.getElementById('token_hash').value = tokenHash;
        }
    }
});
</script>
{% endblock %}
